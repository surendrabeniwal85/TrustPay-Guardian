server:
  port: 0

spring:
  application:
    name: trustpay-guardian-backend-mysql-test
  datasource:
    url: ${SPRING_DATASOURCE_TEST_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/trustpay_guardian_test}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_TEST_USERNAME:${SPRING_DATASOURCE_USERNAME:tpg_app}}
    password: ${SPRING_DATASOURCE_TEST_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
  flyway:
    enabled: true
    user: ${FLYWAY_TEST_USER:${FLYWAY_USER:tpg_flyway}}
    password: ${FLYWAY_TEST_PASSWORD:${FLYWAY_PASSWORD:${SPRING_DATASOURCE_TEST_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}}
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  simulation-mode: true
  security:
    cors:
      allowed-origin: http://localhost:5173
