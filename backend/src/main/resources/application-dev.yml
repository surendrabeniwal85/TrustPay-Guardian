# Development profile configuration with safe local placeholders
# Adopts Option A: Separate tpg_app (runtime DML) and tpg_flyway (migration DDL)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trustpay_guardian?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:tpg_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    user: ${FLYWAY_USER:tpg_flyway}
    password: ${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  security:
    jwt:
      secret: ${JWT_SECRET:TrustPayGuardianSecureJwtSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
