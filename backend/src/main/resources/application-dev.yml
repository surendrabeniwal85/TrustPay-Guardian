# Development profile configuration with safe local placeholders
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trustpay_guardian?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  security:
    jwt:
      secret: ${JWT_SECRET:TrustPayGuardianSecureJwtSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
