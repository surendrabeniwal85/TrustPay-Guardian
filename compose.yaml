# ==============================================================================
# TrustPay Guardian — Local Docker Compose Specification
# Includes MySQL (LTS) and MailHog for development and simulation testing
# ==============================================================================

services:
  mysql:
    image: mysql:9.7.0
    container_name: trustpay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trustpay_guardian}
      MYSQL_USER: ${MYSQL_USER:-trustpay_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trustpay_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: trustpay-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
    driver: local
