name: Feature Request
description: Suggest an idea or enhancement for TrustPay Guardian
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Educational or Architectural Rationale
      description: How does this align with the PRD or full-stack curriculum?
