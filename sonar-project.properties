# SonarQube Project Configuration for TrustPay Guardian
sonar.projectKey=trustpay-guardian
sonar.projectName=TrustPay Guardian - Fraud-Aware Digital Banking Platform
sonar.projectVersion=0.1.0

# Source and Test Folders
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src/__tests__
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar

# Encoding and Language Level
sonar.sourceEncoding=UTF-8
sonar.java.source=25

# JaCoCo XML Coverage Report
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Inclusions and Exclusions
sonar.inclusions=**/*.java,**/*.ts,**/*.tsx,**/*.js,**/*.css
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/*.sql,**/*.json,**/*.md,**/test/**,**/__tests__/**
sonar.coverage.exclusions=**/dto/**,**/config/**,**/entity/**,**/model/**,**/TrustPayGuardianApplication.java
